<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoRank — Order Countries by Size & Population</title>
  <link rel="icon" type="image/svg+xml" href="../favicons/georank.svg">
  <link rel="icon" type="image/png" sizes="180x180" href="../favicons/georank-180.png">
  <link rel="apple-touch-icon" href="../favicons/georank-180.png">
  <meta name="description" content="Drag and drop 10 world countries from largest to smallest by land area or population. Can you get a perfect 10/10?">

  <!-- OpenGraph / WhatsApp Meta Tags -->
  <meta property="og:site_name" content="GeoRank — GeoHub">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cemeren.dev/geohub/georank/">
  <meta property="og:title" content="GeoRank — Order Countries by Size & Population">
  <meta property="og:description" content="Drag and drop 10 world countries from largest to smallest by land area or population. Can you get a perfect 10/10?">
  <meta property="og:image" content="https://cemeren.dev/geohub/og/georank.png">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GeoRank — Order Countries by Size & Population">
  <meta name="twitter:description" content="Drag and drop 10 world countries from largest to smallest by land area or population.">
  <meta name="twitter:image" content="https://cemeren.dev/geohub/og/georank.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Prevent stale caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="../css/atlas.css?v=1">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-game="georank">

  <div class="atlas-page georank">

    <!-- Top Navigation Bar -->
    <header class="atlas-topbar">
      <a href="../" class="atlas-back" title="Back to GeoHub Portal">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>GeoHub</span>
      </a>
      <span class="atlas-title">GeoRank</span>
    </header>

    <!-- Main Game Container -->
    <main class="game-container">

      <!-- Game Controls & Header -->
      <section class="game-header">
        <div class="atlas-segmented" role="group" aria-label="Ranking metric">
          <button id="btn-mode-area" class="is-active" aria-pressed="true" data-metric="area">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
            <span>Land Area</span>
          </button>
          <button id="btn-mode-pop" aria-pressed="false" data-metric="population">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2c2.1.7 3.5 2.8 3.5 5.8"/></svg>
            <span>Population</span>
          </button>
        </div>
        <p class="instructions-text" id="instructions-text">
          Drag &amp; drop or use the arrow buttons to order these 10 countries by <strong>Land Area</strong> from <strong>1st (Largest)</strong> to <strong>10th (Smallest)</strong>.
        </p>
      </section>

      <!-- Draggable Ranking List -->
      <section class="rank-list" id="rank-list" aria-label="Your ranking">
        <!-- Generated dynamically in JS -->
      </section>

      <!-- Bottom Actions -->
      <section class="actions-panel">
        <button id="btn-submit" class="atlas-btn atlas-btn--primary">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span>Submit Ranking</span>
        </button>
        <button id="btn-shuffle" class="atlas-btn" title="Shuffle current countries">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          <span>Shuffle</span>
        </button>
        <button id="btn-new-round" class="atlas-btn" title="Get 10 new random countries">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <span>New Countries</span>
        </button>
      </section>

    </main>
  </div>

  <!-- Results Modal Overlay -->
  <div id="result-modal" class="atlas-modal-backdrop result-backdrop">
    <div class="atlas-modal result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <div class="result-header">
        <div class="result-score mono" id="result-badge-score">8 / 10 Correct</div>
        <h2 id="result-title" class="result-title">Impressive Geography Skills!</h2>
      </div>

      <p class="result-summary" id="result-summary">
        Here is how your arrangement compared to actual values:
      </p>

      <!-- Detailed Breakdown List -->
      <div class="results-breakdown-list" id="results-breakdown-list"></div>

      <div class="modal-actions">
        <button id="btn-modal-next" class="atlas-btn atlas-btn--primary">
          <span>Play Next 10 Countries</span>
          <span aria-hidden="true">→</span>
        </button>
        <button id="btn-modal-close" class="atlas-btn">
          <span>Review Arrangement</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../data/countries.js?v=2"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
