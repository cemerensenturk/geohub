<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoRank — Order Countries by Size & Population</title>
  <meta name="description" content="Drag and drop 10 world countries from largest to smallest by land area or population. Can you get a perfect 10/10?">

  <!-- OpenGraph / WhatsApp Meta Tags -->
  <meta property="og:site_name" content="GeoRank — GeoHub">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cemeren.dev/geohub/georank/">
  <meta property="og:title" content="GeoRank — Order Countries by Size & Population">
  <meta property="og:description" content="Drag and drop 10 world countries from largest to smallest by land area or population. Can you get a perfect 10/10?">
  <meta property="og:image" content="../satelcity.jpeg">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GeoRank — Order Countries by Size & Population">
  <meta name="twitter:description" content="Drag and drop 10 world countries from largest to smallest by land area or population.">
  <meta name="twitter:image" content="../satelcity.jpeg">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Prevent stale caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav-bar">
    <a href="../" class="btn-geohub-back" title="Back to GeoHub Portal">
      <span>← GeoHub</span>
    </a>
    <div class="brand-badge">
      <div class="brand-icon-svg" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="17" width="8" height="17" rx="2" fill="#1e1808" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="10" y="27" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="800" fill="#fde68a" text-anchor="middle">2</text>
          <rect x="16" y="11" width="8" height="23" rx="2" fill="#2d2109" stroke="#fbbf24" stroke-width="1.8"/>
          <text x="20" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="900" fill="#fef08a" text-anchor="middle">1</text>
          <path d="M20 5l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4L20 5z" fill="#f59e0b"/>
          <rect x="26" y="22" width="8" height="12" rx="2" fill="#1e1808" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="30" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="800" fill="#fde68a" text-anchor="middle">3</text>
          <line x1="3" y1="35" x2="37" y2="35" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <span>GeoRank</span>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="game-container">
    
    <!-- Game Controls & Header -->
    <section class="game-header">
      <div class="mode-switch-wrapper">
        <button id="btn-mode-area" class="mode-btn active" data-metric="area">
          <span>📐 Land Area</span>
        </button>
        <button id="btn-mode-pop" class="mode-btn" data-metric="population">
          <span>👥 Population</span>
        </button>
      </div>
      <p class="instructions-text" id="instructions-text">
        Drag & drop or use arrow buttons to order these 10 countries from <strong>1st (Largest)</strong> to <strong>10th (Smallest)</strong>.
      </p>
    </section>

    <!-- Draggable Ranking List -->
    <section class="rank-list" id="rank-list">
      <!-- Generated dynamically in JS -->
    </section>

    <!-- Bottom Actions -->
    <section class="actions-panel">
      <button id="btn-submit" class="btn-primary-action">
        <span>Submit Ranking</span>
        <span>✓</span>
      </button>
      <button id="btn-shuffle" class="btn-secondary-action" title="Shuffle current countries">
        <span>🔀 Shuffle</span>
      </button>
      <button id="btn-new-round" class="btn-secondary-action" title="Get 10 new random countries">
        <span>🔄 New Countries</span>
      </button>
    </section>

    <!-- Results Modal Overlay -->
    <div id="result-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="result-header">
          <div class="result-badge-score" id="result-badge-score">8 / 10 Correct</div>
          <h2 id="result-title" class="result-title">Impressive Geography Skills!</h2>
        </div>
        
        <p class="result-summary" id="result-summary">
          Here is how your arrangement compared to actual values:
        </p>

        <!-- Detailed Breakdown List -->
        <div class="results-breakdown-list" id="results-breakdown-list"></div>

        <div class="modal-actions">
          <button id="btn-modal-next" class="btn-primary-action">
            <span>Play Next 10 Countries</span>
            <span>→</span>
          </button>
          <button id="btn-modal-close" class="btn-secondary-action">
            <span>Review Arrangement</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="../data/countries.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
