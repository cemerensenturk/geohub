<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Quiz - GeoHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-nav-bar">
        <a href="../" class="btn-geohub-back" title="Back to GeoHub Portal">
            <span>← GeoHub</span>
        </a>
        <h1 class="header-title">Flags Quiz</h1>
    </header>

    <div id="quiz-container">
        <div id="question">
            <img id="flag-image" src="" alt="Flag">
        </div>
        <div id="options">
        </div>
        <div id="score">
            Score: <span id="score-value">0</span> / <span id="question-count-value">0</span>
        </div>
        <div id="countryInfo">
        </div>
        <button id="next-question" onclick="showNextQuestion()">Next Question</button>
    </div>

    <!-- Shared data & API script -->
    <script src="../data/countries.js"></script>
    <script src="js/quiz.js?v=2"></script>
</body>
</html>
