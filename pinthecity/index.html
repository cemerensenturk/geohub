<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin the City — Drop a Pin on the World Map</title>
  <link rel="icon" type="image/svg+xml" href="../favicons/pinthecity.svg">
  <link rel="icon" type="image/png" sizes="180x180" href="../favicons/pinthecity-180.png">
  <link rel="apple-touch-icon" href="../favicons/pinthecity-180.png">
  <meta name="description" content="A city name, a blank world map: drop a pin where you think it is. The closer you get, the more points you score.">

  <!-- OpenGraph / WhatsApp Meta Tags -->
  <meta property="og:site_name" content="Pin the City — GeoHub">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cemeren.dev/geohub/pinthecity/">
  <meta property="og:title" content="Pin the City — Drop a Pin on the World Map">
  <meta property="og:description" content="Find 10 world cities on a blank map. How many kilometres off are you?">
  <meta property="og:image" content="https://cemeren.dev/geohub/og/pinthecity.png">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pin the City — Drop a Pin on the World Map">
  <meta name="twitter:description" content="Find 10 world cities on a blank map. How many kilometres off are you?">
  <meta name="twitter:image" content="https://cemeren.dev/geohub/og/pinthecity.png">

  <!-- Google Fonts: Atlas (Newsreader, Public Sans, IBM Plex Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/atlas.css?v=1">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body data-game="pinthecity">

  <div class="atlas-page">

    <header class="atlas-topbar">
      <a href="../" class="atlas-back" title="Back to GeoHub">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>GeoHub</span>
      </a>
      <span class="atlas-title">Pin the City</span>
    </header>

    <section class="atlas-stats" aria-label="Stats">
      <span class="atlas-stat"><span class="atlas-stat-label">Round</span><span class="atlas-stat-value" id="stat-round">1 / 10</span></span>
      <span class="atlas-stat"><span class="atlas-stat-label">Score</span><span class="atlas-stat-value" id="stat-score">0</span></span>
      <span class="atlas-stat"><span class="atlas-stat-label">Best</span><span class="atlas-stat-value" id="stat-best">–</span></span>
      <div class="atlas-segmented pc-difficulty" role="group" aria-label="Difficulty">
        <button type="button" data-difficulty="easy" aria-pressed="true">Easy</button>
        <button type="button" data-difficulty="hard" aria-pressed="false">Hard</button>
      </div>
    </section>

    <main class="pc-layout">

      <section class="pc-map-card atlas-panel">
        <div class="pc-prompt">
          <p class="pc-prompt-text">
            <span class="atlas-eyebrow">Find</span>
            <span class="pc-city" id="prompt-city">…</span>
          </p>
          <span class="atlas-chip atlas-chip--accent" id="prompt-country" hidden></span>
        </div>

        <div class="pc-map" id="map" tabindex="0" role="application" aria-label="World map. Click or tap to place your pin. Arrow keys pan, plus and minus zoom.">
          <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <rect class="pc-sea" id="map-sea"></rect>
            <g id="map-graticule" class="pc-graticule"></g>
            <path id="map-land" class="pc-land"></path>
            <line id="map-line" class="pc-line" hidden></line>
            <g id="map-target" class="pc-target" hidden>
              <circle class="pc-target-halo" r="14"></circle>
              <circle class="pc-target-dot" r="6"></circle>
            </g>
            <g id="map-pin" class="pc-pin" hidden>
              <path d="M0 0 C-3 -6 -10 -11 -10 -18 A10 10 0 0 1 10 -18 C10 -11 3 -6 0 0 Z"></path>
              <circle cx="0" cy="-18" r="3.6"></circle>
            </g>
            <g id="map-target-label" class="pc-target-label" hidden>
              <text id="map-target-text"></text>
            </g>
          </svg>

          <div class="pc-zoom" role="group" aria-label="Zoom">
            <button type="button" class="pc-zoom-btn" id="zoom-in" aria-label="Zoom in">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button type="button" class="pc-zoom-btn" id="zoom-out" aria-label="Zoom out">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
            <button type="button" class="pc-zoom-btn" id="zoom-reset" aria-label="Show the whole map">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            </button>
          </div>
        </div>
      </section>

      <aside class="pc-side atlas-panel" aria-live="polite">
        <div id="side-question">
          <p class="pc-hint">Click or tap the map to drop your pin. Drag to pan, scroll or pinch to zoom.</p>
          <button type="button" class="atlas-btn atlas-btn--primary pc-wide" id="btn-confirm" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10.5a6 6 0 0 1 12 0C18 15.7 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg>
            <span>Confirm pin</span>
          </button>
          <p class="pc-keys mono">Enter confirms · +/− zoom · arrows pan</p>
        </div>

        <div id="side-result" hidden>
          <div class="pc-result-grid">
            <div class="pc-result-cell"><span class="atlas-stat-label">Off by</span><span class="pc-result-value mono" id="result-km">–</span></div>
            <div class="pc-result-cell"><span class="atlas-stat-label">Points</span><span class="pc-result-value mono" id="result-points">–</span></div>
          </div>
          <p class="atlas-feedback" id="result-feedback"></p>
          <button type="button" class="atlas-btn atlas-btn--primary pc-wide" id="btn-next">
            <span id="btn-next-label">Next city</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </aside>

    </main>
  </div>

  <div class="atlas-modal-backdrop" id="summary" hidden>
    <div class="atlas-modal pc-summary" role="dialog" aria-modal="true" aria-labelledby="summary-title">
      <div class="pc-summary-icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </div>
      <h2 id="summary-title">Session complete</h2>
      <p class="pc-summary-score"><span class="mono" id="summary-total">0</span><span class="pc-summary-max mono"> / 1000</span></p>
      <p class="pc-summary-best" id="summary-best"></p>
      <ol class="pc-summary-list" id="summary-list"></ol>
      <button type="button" class="atlas-btn atlas-btn--primary pc-wide" id="btn-again">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span>Play again</span>
      </button>
    </div>
  </div>

  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
